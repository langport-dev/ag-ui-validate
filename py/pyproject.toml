[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ag-ui-validate"
version = "0.4.0"
description = "Conformance validator for the AG-UI protocol"
readme = "README.md"
license = "MIT"
authors = [{ name = "Faraz" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/langport-dev/ag-ui-validate"
Repository = "https://github.com/langport-dev/ag-ui-validate"
Issues = "https://github.com/langport-dev/ag-ui-validate/issues"

[project.scripts]
ag-ui-validate = "ag_ui_validate.cli:main"

[project.entry-points.pytest11]
ag_ui_validate = "ag_ui_validate.pytest_plugin"

[project.optional-dependencies]
# Only needed for ag_ui_validate.transport (validate_endpoint/validate_body) and
# the CLI's URL code path — imported lazily there. The importable core and the
# pytest plugin's recorded-stream helpers stay dependency-free without this.
transport = [
  "httpx>=0.27",
]
dev = [
  # Official pydantic-based AG-UI SDK — devDependency only, mirrors @ag-ui/core's
  # role on the TS side (protocol derivation + drift tests). Never a runtime dep.
  "ag-ui-protocol>=0.1.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "mypy>=1.14",
  "ag-ui-validate[transport]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ag_ui_validate"]

[tool.hatch.build.targets.wheel.force-include]
"spec" = "ag_ui_validate/spec"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
# Test files: bodies still checked (catches real errors — wrong argument
# types, API misuse — strict's own check_untyped_defs still applies), but
# not required to annotate every `def test_x():`. mypy's disallow_*_defs
# trio has no real TS equivalent for test files — TS infers signatures from
# usage; mypy cannot infer a function's own parameter/return types the same
# way, so mirroring TS's actual behavior (real errors caught, no blanket
# annotation mandate) means turning off just the annotation-mandate flags.
# (Note: putting `strict = true` directly in an override, instead of at the
# top level like above, does NOT work as "strict for this module only" —
# mypy warns some of strict's flags are global-only and applies them
# globally regardless of module scoping, silently defeating the override.)
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
