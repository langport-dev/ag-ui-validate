name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
        working-directory: py
      - run: pytest
        working-directory: py

  action-self-test:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: action passes on a valid stream
        id: good
        uses: ./action
        with:
          target: spec/fixtures/valid/agentic-chat.jsonl
          version: local
      - name: action fails on a violating stream
        id: bad
        uses: ./action
        continue-on-error: true
        with:
          target: spec/fixtures/invalid/AGUI203-unterminated-tool-call/stream.jsonl
          version: local
          sarif-file: agui.sarif
      - name: assert the failing run behaved as documented
        shell: bash
        run: |
          test "${{ steps.bad.outcome }}" = "failure"
          test "${{ steps.bad.outputs.errors }}" = "1"
          test "${{ steps.good.outputs.errors }}" = "0"
          node -e "const s = JSON.parse(require('node:fs').readFileSync('./agui.sarif', 'utf8')); if (s.version !== '2.1.0') process.exit(1)"
