name: Publish to PyPI

# Publishes the Python package (py/) to PyPI when a GitHub release tagged
# "vX.Y.Z" is published — the SAME tag publish.yml (npm) triggers on. Auth
# is PyPI Trusted Publishing (OIDC): no token secret — pypi.org has a
# pending publisher configured (one-time, scoped to this repo + this
# workflow filename, no environment) that will activate on this workflow's
# first successful run, minting a short-lived credential per run.
#
# The JS and Python packages are versioned in lockstep from v0.3.0 onward:
# one release, one tag, both packages publish together. The version-match
# check below is what makes that safe rather than assumed — if py's
# declared version ever drifts from the tag (e.g. someone bumps only one
# package.json/pyproject.toml), this job fails loudly instead of silently
# publishing a mismatched version. (Earlier revisions of this workflow used
# a distinct "python-v" tag prefix, back when the two packages versioned
# independently and Python was still a 0.0.x placeholder — no longer the
# case.)
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for PyPI trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Release tag must match py/pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="v$(python -c "import re; print(re.search(r'(?m)^version = \"([^\"]+)\"', open('py/pyproject.toml').read()).group(1))")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag $TAG does not match py/pyproject.toml $PKG — bump the version, merge, then re-tag"
            exit 1
          fi

      - run: pip install build
      - run: python -m build py --outdir py/dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist
