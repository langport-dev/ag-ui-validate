name: Publish

# Publishes to npm when a GitHub release is published. Auth is npm Trusted
# Publishing (OIDC): no token secret — npmjs.com is configured (one-time, in
# the package's settings) to trust this repo + workflow, and npm mints a
# short-lived credential per run, with provenance attached automatically.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: npm ci

      - name: Release tag must match package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::release tag $TAG does not match package.json $PKG — run 'npx changeset version', merge the bump, then re-tag"
            exit 1
          fi

      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm publish
